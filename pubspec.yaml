name: reservation_reminder
description: 시설별 예약 규칙에 따라 예약 시점을 자동 계산하고 로컬 알림을 제공하는 개인용 앱.
publish_to: "none"
# 형식: <사용자용 버전>+<빌드번호(versionCode)>. 빌드마다 증가.
version: 1.0.1+3

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 상태 관리
  flutter_riverpod: ^2.5.1

  # 로컬 DB (Drift + SQLite)
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # 로컬 알림
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.3
  flutter_timezone: ^5.1.0

  # 달력 UI
  table_calendar: ^3.1.1

  # 기타
  intl: ^0.20.2
  uuid: ^4.4.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Drift 코드 생성
  drift_dev: ^2.16.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
